<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Kapi</title><style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --text:#1a1d21; --muted:#6b7280;
  --border:#e3e6ea; --accent:#2563eb; --accent-hover:#1d4ed8; --accent-text:#ffffff;
  --user-bg:#2563eb; --user-text:#ffffff; --code-bg:#0f172a; --code-text:#e2e8f0;
  --danger:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --surface:#171a20; --surface-2:#1f232b; --text:#e6e8eb; --muted:#9aa0aa;
    --border:#2a2f38; --accent:#3b82f6; --accent-hover:#2563eb; --code-bg:#0b0f16;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
.app{max-width:780px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
header .title{font-weight:700;font-size:17px}
header .spacer{flex:1}
.chip{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
button{font:inherit;cursor:pointer;border:0}
button.primary{background:var(--accent);color:var(--accent-text);border-radius:999px;padding:10px 20px;font-weight:600}
button.primary:hover{background:var(--accent-hover)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:100%;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--user-bg);color:var(--user-text);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:85%;white-space:pre-wrap}
.msg.ai{align-self:stretch;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 16px}
.msg.ai .who{font-size:12px;color:var(--muted);margin-bottom:4px}
.answer p{margin:0 0 10px}.answer p:last-child{margin-bottom:0}
.answer h1,.answer h2,.answer h3{margin:14px 0 8px;line-height:1.3}
.answer h1{font-size:19px}.answer h2{font-size:17px}.answer h3{font-size:16px}
.answer ul,.answer ol{margin:0 0 10px;padding-left:22px}
.answer li{margin:3px 0}
.answer a{color:var(--accent)}
.answer code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 5px}
.answer pre{margin:0 0 10px;background:var(--code-bg);border-radius:10px;padding:12px;overflow-x:auto}
.answer pre code{background:none;border:0;padding:0;color:var(--code-text);font-size:13px;line-height:1.5}
.answer blockquote{margin:0 0 10px;padding:4px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.answer table{border-collapse:collapse;margin:0 0 10px;font-size:14px;display:block;overflow-x:auto}
.answer th,.answer td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.answer th{background:var(--surface-2)}
.answer hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.think{font-size:12px;color:var(--muted);margin-bottom:6px}
.think summary{cursor:pointer}
.think .tlog{margin:6px 0 0;padding-left:12px;border-left:2px solid var(--border);white-space:pre-wrap}
.dots::after{content:'…';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'…'}50%{content:'……'}75%{content:'………'}100%{content:''}}
.err{color:var(--danger)}
.usage{font-size:12px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
#composer{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface)}
#composer input{flex:1;padding:12px 16px;font-size:16px;font-family:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;outline:none}
#composer input:focus{border-color:var(--accent)}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.login-card h1{margin:0 0 6px;font-size:22px}
.login-card p{margin:0 0 16px;color:var(--muted);font-size:14px}
.login-card input{display:block;width:100%;padding:12px 14px;margin:0 0 10px;font-size:16px;font-family:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:12px;outline:none}
.login-card input:focus{border-color:var(--accent)}
.login-card button.primary{width:100%;margin-top:4px}
.login-card .small{font-size:12px;color:var(--muted);margin:14px 0 0}
#msg{min-height:20px;margin:10px 0 0}
</style></head><body>
<div class="app" id="loginView">
  <div class="login-wrap"><div class="login-card">
    <h1>Kapi</h1>
    <p>登录后开始聊天。登录状态保留 12 小时，刷新页面不用重新登录。</p>
    <input id="u" placeholder="用户名" autocomplete="username">
    <input id="p" type="password" placeholder="密码" autocomplete="current-password">
    <button class="primary" onclick="login()">登录</button>
    <p id="msg" class="err"></p>
    <p class="small">演示账号见 .env 的 GATEWAY_USERS（生产请换 Keycloak / Authentik）。首次登录会稍等几秒，等你的助手启动。</p>
  </div></div>
</div>
<div class="app" id="chatView" style="display:none">
  <header><div class="title">Kapi</div><div class="spacer"></div><span id="who" class="chip"></span><button class="ghost" onclick="logout()">退出</button></header>
  <div id="log"></div>
  <form id="composer" onsubmit="send(event)"><input id="q" autocomplete="off" placeholder="跟助手说点什么…"><button class="primary" type="submit">发送</button></form>
</div>
<script>
// 身份全靠 cookie：登录时服务器种 HttpOnly 的 mt_token（12 小时），
// 浏览器每次请求自动带上，JS 不读也不存 token，刷新、关掉重开都还在。
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkify(s){return s.replace(/(?<!href="|">)(https?:[/][/][^\s<>"'，。；：、）】]+|[/]files[/][^\s<>"'，。；：、）】]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function renderMarkdown(src){
  // 无依赖的轻量 Markdown：先转义 HTML（防 XSS），再处理块和行内样式。
  // 支持：标题、粗体、斜体、行内代码、代码块、列表、引用、分隔线、表格、
  // [文本](链接)、裸链接（含 /files/ 相对链接）。
  let text = esc(src);
  const blocks = [];
  text = text.replace(/```[^\n]*\n([\s\S]*?)(?:```|$)/g, function(m, code){
    blocks.push('<pre><code>' + code.replace(/\n+$/, '') + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  const codes = [];
  text = text.replace(/`([^`\n]+)`/g, function(m, code){
    codes.push('<code>' + code + '</code>');
    return '\u0001' + (codes.length - 1) + '\u0001';
  });
  function inline(s){
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // 裸链接：href="..." 里和链接文本里的不重复包（lookbehind 挡住）。
    s = linkify(s);
    return s;
  }
  const lines = text.split('\n');
  let html = '', i = 0, para = [];
  function flush(){ if(para.length){ html += '<p>' + inline(para.join('\n')).replace(/\n/g, '<br>') + '</p>'; para = []; } }
  while(i < lines.length){
    const line = lines[i];
    let m;
    if(!line.trim()){ flush(); i++; continue; }
    if(/^\u0000\d+\u0000$/.test(line)){ flush(); html += blocks[+line.slice(1, -1)]; i++; continue; }
    if((m = line.match(/^(#{1,6})\s+(.+)$/))){ flush(); html += '<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'; i++; continue; }
    if(/^(---+|\*\*\*+)$/.test(line.trim())){ flush(); html += '<hr>'; i++; continue; }
    if((m = line.match(/^&gt;\s?(.*)$/))){ flush(); const q = []; while(i < lines.length && (m = lines[i].match(/^&gt;\s?(.*)$/))){ q.push(m[1]); i++; } html += '<blockquote>' + inline(q.join('\n')).replace(/\n/g, '<br>') + '</blockquote>'; continue; }
    if(/^[-*+]\s+/.test(line)){ flush(); const items = []; while(i < lines.length && /^[-*+]\s+/.test(lines[i])){ items.push('<li>' + inline(lines[i].replace(/^[-*+]\s+/, '')) + '</li>'); i++; } html += '<ul>' + items.join('') + '</ul>'; continue; }
    if(/^\d+[.)]\s+/.test(line)){ flush(); const items = []; while(i < lines.length && /^\d+[.)]\s+/.test(lines[i])){ items.push('<li>' + inline(lines[i].replace(/^\d+[.)]\s+/, '')) + '</li>'); i++; } html += '<ol>' + items.join('') + '</ol>'; continue; }
    if(line.startsWith('|')){
      const next = lines[i + 1] || '';
      if(/^\|[\s:|-]+\|$/.test(next.trim())){
        flush();
        const head = line.split('|').slice(1, -1).map(function(c){ return '<th>' + inline(c.trim()) + '</th>'; }).join('');
        const rows = []; i += 2;
        while(i < lines.length && lines[i].startsWith('|')){ rows.push('<tr>' + lines[i].split('|').slice(1, -1).map(function(c){ return '<td>' + inline(c.trim()) + '</td>'; }).join('') + '</tr>'); i++; }
        html += '<table><thead><tr>' + head + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>'; continue;
      }
    }
    para.push(line); i++;
  }
  flush();
  html = html.replace(/\u0001(\d+)\u0001/g, function(m, n){ return codes[+n]; });
  return html;
}
function fmtNum(n){return (n||0).toLocaleString('en-US');}
function usageText(u){ if(!u) return '';
 let s='Token：输入 '+fmtNum(u.input_tokens);
 if(u.cached_tokens) s+='（缓存 '+fmtNum(u.cached_tokens)+'）';
 s+=' · 输出 '+fmtNum(u.output_tokens);
 if(u.reasoning_tokens) s+='（思考 '+fmtNum(u.reasoning_tokens)+'）';
 s+=' · 合计 '+fmtNum(u.total_tokens);
 if(u.cost_usd!=null) s+=' · 约 $'+Number(u.cost_usd).toFixed(4);
 if(u.tenant_usage){ const t=u.tenant_usage; s+=' ｜ 累计 '+fmtNum(t.tokens_total)+' tokens'; if(t.cost_estimate!=null) s+=' · 约 $'+Number(t.cost_estimate).toFixed(4); }
 return s; }
function showUsage(wrap, u){ const t=usageText(u); if(!t) return;
 let el=wrap.querySelector('.usage'); if(!el){ el=document.createElement('div'); el.className='usage'; wrap.appendChild(el); }
 el.textContent=t; }
function thinkLine(tlog, text){ const d=document.createElement('div'); d.textContent=text; tlog.appendChild(d); }
function showChat(tenant){
 document.getElementById('loginView').style.display='none';
 document.getElementById('chatView').style.display='flex';
 document.getElementById('who').textContent=tenant;
 document.getElementById('q').focus();
}
function showLogin(msg){
 document.getElementById('chatView').style.display='none';
 document.getElementById('loginView').style.display='flex';
 if(msg) document.getElementById('msg').textContent=msg;
}
async function restore(){
 // 刷新后：cookie 还在就直接问一句 /api/me，认得出就进聊天，不用重新登录。
 try{
  const r=await fetch('/api/me');
  if(!r.ok) return;
  const d=await r.json();
  showChat(d.tenant || '');
 }catch(_){ /* 网络问题，留在登录页 */ }
}
async function login(){
 const u=document.getElementById('u').value.trim();
 const p=document.getElementById('p').value;
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
 const d=await r.json();
 if(!r.ok){document.getElementById('msg').textContent=(d.error&&d.error.message)||d.error||'登录失败';return;}
 showChat(d.tenant);
}
function logout(){
 // 清掉登录 cookie（HttpOnly 的 JS 读不到，但按名+路径删是删得掉的）。
 document.cookie='mt_token=; path=/; max-age=0; SameSite=Lax';
 document.getElementById('log').innerHTML='';
 showLogin();
}
function postChat(path, t){ return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})}); }
async function send(e){e.preventDefault();
 const q=document.getElementById('q'); const t=q.value.trim(); if(!t) return; q.value='';
 const log=document.getElementById('log');
 const me=document.createElement('div'); me.className='msg me'; me.textContent=t;
 log.appendChild(me); log.scrollTop=log.scrollHeight;
 // 先把助手气泡占出来：思考过程折叠区 + 回答区 + 跳动的点，用户不用干等。
 const wrap=document.createElement('div'); wrap.className='msg ai';
 wrap.innerHTML=`<div class="who">助手</div><details class="think" open><summary>思考过程</summary><div class="tlog"></div></details><div class="answer"><span class="dots">思考中</span></div>`;
 log.appendChild(wrap); log.scrollTop=log.scrollHeight;
 const tlog=wrap.querySelector('.tlog'), ans=wrap.querySelector('.answer');
 const thinking=wrap.querySelector('.think');
 let buf='', answer='', gotEvent=false, settled=false;
 let reasonEl=null;
 function thinkReasoning(text){ // 推理是按 token 流的：都追加进同一个 div，成一段话，不一行一个字
  if(!reasonEl){ reasonEl=document.createElement('div'); tlog.appendChild(reasonEl); }
  reasonEl.textContent+=text; }
 function finish(){ if(settled) return; settled=true;
   ans.innerHTML=renderMarkdown(answer)||'<span class="err">出错了</span>';
   thinking.open=false; log.scrollTop=log.scrollHeight; }
 async function fallback(note){
  const r=await postChat('/api/chat', t);
  if(r.status===401){ showLogin('登录已过期，请重新登录'); return; }
  const d=await r.json().catch(()=>({}));
  answer=d.reply||(d.error&&d.error.message)||d.error||'出错了';
  if(d.usage) showUsage(wrap, d.usage);
  thinkLine(tlog, note); finish();
 }
 try{
  const r=await postChat('/api/chat/stream', t);
  if(r.status===401){ showLogin('登录已过期，请重新登录'); return; }
  if(!r.ok || !r.body){ await fallback('（流式不可用，已回退到整段返回）'); return; }
  const reader=r.body.getReader(), dec=new TextDecoder();
  while(true){ const {done,value}=await reader.read(); if(done) break;
   buf+=dec.decode(value,{stream:true});
   let idx; while((idx=buf.indexOf('\n\n'))>=0){ const raw=buf.slice(0,idx); buf=buf.slice(idx+2);
    for(const line of raw.split('\n')){ if(!line.startsWith('data:')) continue;
     let ev; try{ ev=JSON.parse(line.slice(5).trim()); }catch(_){ continue; }
     gotEvent=true;
     if(ev.type==='status'){ thinkLine(tlog, ev.text||ev.stage); }
     else if(ev.type==='reasoning'){ thinkReasoning(ev.text); }
     else if(ev.type==='token'){ answer+=ev.text; ans.innerHTML=renderMarkdown(answer); }
     else if(ev.type==='tool_call'){ thinkLine(tlog, '🔧 调用工具 '+ev.name+'('+JSON.stringify(ev.args||{})+')'); }
     else if(ev.type==='tool_result'){ thinkLine(tlog, '✓ '+(ev.name||'工具')+' 返回：'+(ev.result||'')); }
     else if(ev.type==='reminder_delivered'){ thinkLine(tlog, '⏰ 到点提醒：'+ev.text); }
     else if(ev.type==='usage'){ showUsage(wrap, ev); }
     else if(ev.type==='done'){ answer=ev.reply||answer; if(ev.usage) showUsage(wrap, ev.usage); finish(); }
     else if(ev.type==='error'){ answer=ev.message||'出错了'; ans.innerHTML='<span class="err">'+esc(answer)+'</span>'; thinking.open=false; settled=true; }
    }
    log.scrollTop=log.scrollHeight;
   }
  }
  if(!gotEvent){ await fallback('（流式无事件，已回退到整段返回）'); return; }
  finish();
 }catch(err){ // 网络异常：回退老接口
  try{ await fallback('（流式失败，已回退到整段返回）'); }
  catch(_){ answer='网络出错了，请再试一次'; finish(); }
 }
}
document.addEventListener('DOMContentLoaded', restore);
</script></body></html>
