# 一租户一容器（2026-11-26 重构）：compose 只起常驻服务，
# 租户 agent 容器（mt-tenant-<租户>）由网关按需 docker run / start，
# 不在 compose 里写死。
#
# 常驻服务：
#   gateway  — 唯一对外端口 8080；登录 + 管租户容器 + 反向代理
#   browser  — 共享浏览器服务（P4 起只是 fallback：主路是每租户一个
#              browser 容器，网关按需 docker run；共享服务默认还起，
#              保证老行为不断，见下面 browser 服务的注释）
#   postgres / redis — 可选（profiles: optional），当前 agent 默认不用
#
# 租户镜像不在这里起：先 build（见 README 快速开始），网关再用它起容器。
services:
  gateway:
    # P1：构建上下文是仓库根目录（不是 ./gateway），因为网关要拷顶层
    # errors/（统一错误码）和 gateway/web/login.html，见 gateway/Dockerfile。
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: mt-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
      # 租户容器配置（默认值见 .env.example，改 .env 就行）
      - DOCKER_NETWORK=${DOCKER_NETWORK:-multi-tenant-agent_default}
      - AGENT_IMAGE=${AGENT_IMAGE:-multi-tenant-agent-agent-api:latest}
      - TENANT_CPU=${TENANT_CPU:-0.5}
      - TENANT_MEMORY=${TENANT_MEMORY:-512m}
      - TENANT_IDLE_MINUTES=${TENANT_IDLE_MINUTES:-30}
      # P2 管理面（只对内）：管理 API 单独监听 127.0.0.1:8082，不发布
      # 端口，只能 docker exec 进容器调；GATEWAY_ADMIN_TOKEN 不设则
      # 管理接口拒绝服务（不启动监听）。ADMIN_PORT 一般不用改。
      - ADMIN_PORT=8082
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:-}
    ports:
      # 唯一对外端口，只放局域网，不要映射到公网
      - "8080:8080"
    volumes:
      # 网关要调宿主机 Docker 起/停租户容器，必须挂 docker.sock。
      # 高权限点：拿到这个 sock 就等于拿到宿主机 root，
      # 只在自己可信的单机上用，见 README 安全提醒。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - browser

  # 构建租户镜像用（不常驻、不自动起）：
  #   docker compose --profile build build agent-image
  # 或直接：docker build -t multi-tenant-agent-agent-api:latest .
  # 镜像必须先存在，网关 docker run 时不会自动 build。
  agent-image:
    build: .
    image: multi-tenant-agent-agent-api:latest
    profiles: ["build"]

  browser:
    build: ./browser
    container_name: mt-browser
    restart: unless-stopped
    environment:
      - PORT=8001
      - DATA_DIR=/data
    expose:
      - "8001"
    volumes:
      # 共享浏览器先保留：所有租户共用这一个 Chromium 服务。
      # P4：它是 fallback，不是主路——主路是每租户一个 browser 容器
      # mt-browser-<租户>（网关登录时按需 docker run 起，见
      # gateway/infra/runtime.py 的 ensure_browser_container；
      # 镜像用下面的 browser-image 构建）。租户容器把租户卷挂到
      # /data，截图落在租户卷的 workspace 里；共享容器看不到租户卷，
      # 所以它的截图会落在宿主机 ./data 下（fallback 时工具返回里会注明）。
      # 部署验证时老行为不断：共享服务还在、默认还起；等租户容器在
      # 服务器上跑稳了，再考虑把它收进 profile。
      - ./data:/data
    # Chromium 在容器里跑需要共享内存，不然容易崩
    shm_size: 1gb

  # 按租户 browser 容器的镜像（P4，不常驻、不自动起）：
  #   docker compose --profile build build browser-image
  # 构建出来就是 BROWSER_IMAGE（默认 multi-tenant-agent-browser:latest），
  # 网关登录时按需 docker run 起 mt-browser-<租户>。
  browser-image:
    build: ./browser
    image: multi-tenant-agent-browser:latest
    profiles: ["build"]

  # 可选服务：当前版本 agent 默认用每租户 SQLite，不依赖它俩。
  # 留给以后做共享元数据（postgres）/ 限流缓存（redis）时用。
  # 默认不启动，需要时：docker compose --profile optional up -d
  postgres:
    image: postgres:16-alpine
    container_name: mt-postgres
    restart: unless-stopped
    profiles: ["optional"]
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mt_agent}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-mt_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不发布端口：只在容器内网用

  redis:
    image: redis:7-alpine
    container_name: mt-redis
    restart: unless-stopped
    profiles: ["optional"]
    volumes:
      - redisdata:/data
    # 不发布端口：只在容器内网用

volumes:
  pgdata:
  redisdata:
  # 租户数据卷（mt-data-<租户>）由网关 docker run 时自动创建，
  # 不用在这里逐个声明；docker volume ls 能看到，删卷 = 删该租户全部数据。
